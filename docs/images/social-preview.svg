<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>nora: a GPU-accelerated terminal for Linux with inline command suggestions</title>
  <defs>
    <radialGradient id="mint" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#5ef2b5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ef2b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.88" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2b5" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5ef2b5" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#4cc9f0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2133"/>
      <stop offset="1" stop-color="#0c0f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="50" y1="80" x2="212" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ef2b5"/>
      <stop offset="0.5" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b0e15"/>
  <rect width="1280" height="640" fill="url(#mint)"/>
  <rect width="1280" height="640" fill="url(#violet)"/>
  <path d="M-40 150 C 260 60, 520 250, 820 130 S 1180 60, 1320 140" fill="none" stroke="url(#ribbon)" stroke-width="46" filter="url(#soft)"/>
  <path d="M-40 520 C 300 600, 640 430, 960 540 S 1240 600, 1320 520" fill="none" stroke="url(#ribbon)" stroke-width="30" filter="url(#soft)" opacity="0.6"/>

  <!-- icon + wordmark, centred -->
  <g transform="translate(249 150)">
    <g transform="scale(0.72)">
      <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
      <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
      <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
      <path d="M58 86 L104 128 L58 170" fill="none" stroke="url(#aurora)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="118" y="152" width="38" height="20" rx="10" fill="url(#aurora)"/>
      <rect x="164" y="152" width="28" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.42"/>
      <rect x="200" y="152" width="20" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.18"/>
    </g>
    <g transform="translate(252 40) scale(1.6)" fill="none" stroke="#eef1f8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 V64 M0 30 a28 28 0 0 1 56 0 V64"/>
      <circle cx="122" cy="32" r="32"/>
      <path d="M188 0 V64 M188 34 a30 30 0 0 1 30 -30"/>
      <circle cx="280" cy="32" r="32"/>
      <path d="M312 0 V64"/>
    </g>
  </g>

  <text x="640" y="422" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="34" fill="#aab3c8">A GPU-accelerated terminal for Linux, written in Rust</text>

  <!-- an inline suggestion, as nora draws it -->
  <g font-family="JetBrainsMono Nerd Font, Noto Sans Mono, monospace" font-size="30">
    <rect x="390" y="462" width="500" height="64" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="418" y="504"><tspan fill="#5ef2b5">❯</tspan><tspan fill="#eef1f8" dx="16">cargo t</tspan><tspan fill="#6b7489">est --workspace</tspan></text>
  </g>
</svg>
