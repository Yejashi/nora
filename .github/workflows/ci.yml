# nora CI (N30): clean-checkout build, headless checks, explicit backend
# configurations and display smoke jobs.
#
# Jobs:
#   checks         cargo fmt --check + clippy -D warnings
#   build          release build on a clean checkout + binary runs
#   test           full test suite, headless, with a software GPU
#   backends       explicit X11-only / Wayland-only build configurations
#   x11-smoke      windowed smoke under a virtual X11 display (Xvfb)
#   wayland-smoke  windowed smoke under a nested Wayland compositor
#   cross-platform macOS and Windows: release build, unit tests and the
#                  platform-neutral integration tests (macOS also runs
#                  the PTY tests). No display or GPU checks there.
#   e2e-x11        end-to-end window checks (scripts/e2e-x11.sh): real key
#                  events, screenshots, PTY evidence files
#
# A software GPU (lavapipe) validates lifecycle and rendering paths; it
# is not hardware performance evidence.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # rust-toolchain.toml pins the project toolchain; CI installs exactly
  # that channel so results match the documented build inputs.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  checks:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: release build (clean checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Verify the binary runs
        run: |
          ./target/release/nora --version
          ./target/release/nora --help
      - name: Headless config check (no display or GPU needed)
        run: ./target/release/nora --check-config

  test:
    name: tests (headless + software GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Software Vulkan (lavapipe) so the offscreen GPU tests have a
          # real adapter in CI. A software GPU validates lifecycle and
          # rendering paths; it is not hardware performance evidence.
          # The Noto fonts are the pinned test fonts (metrics are asserted).
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers \
            fonts-noto-core fonts-noto-cjk
      - name: cargo test
        run: |
          set +e
          cargo test --no-fail-fast --locked 2>&1 | tee test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          # Surface failing test names and panic sites as annotations, so a
          # failure is diagnosable from the public check-run API.
          grep -E "^test .* FAILED$|panicked at|^test result: FAILED" test.log \
            | sort -u | head -40 | sed 's/^/::error::/' || true
          exit "$STATUS"
      - name: Allocation counter (alloc-count measurement feature)
        run: cargo test --locked --features alloc-count --test alloc_count
      - name: Headless launch smoke (no display server)
        run: |
          # With no display server the launch path falls back to the
          # headless session pump (CI-safe); the child's exit status is
          # propagated.
          ./target/debug/nora -- /bin/echo nora-headless-smoke
          set +e
          ./target/debug/nora -- /bin/sh -c 'exit 3'
          STATUS=$?
          set -e
          test "$STATUS" -eq 3

  backends:
    name: backend matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: X11 only
            features: x11
          - name: Wayland only
            features: wayland
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.name }}
      - name: cargo build (explicit backend configuration)
        run: >
          cargo build --release --locked
          --no-default-features --features ${{ matrix.features }}
      - name: Verify the binary runs
        run: ./target/release/nora --version

  x11-smoke:
    name: X11 display smoke (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xkb-data libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers fonts-noto-core fonts-noto-cjk
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Windowed smoke under Xvfb
        run: |
          # One automated open/resize/minimize/close cycle plus one
          # windowed launch, under a virtual X11 display.
          xvfb-run -a ./target/release/nora --smoke
          xvfb-run -a ./target/release/nora -- /bin/echo x11-smoke

  wayland-smoke:
    name: Wayland display smoke (Weston headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston xkb-data libxkbcommon0 \
            libvulkan1 mesa-vulkan-drivers fonts-noto-core fonts-noto-cjk
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Windowed smoke under Weston headless
        env:
          DISPLAY: ""
          # GitHub runners do not set XDG_RUNTIME_DIR; both weston and the
          # Wayland client need it (the socket lives there).
          XDG_RUNTIME_DIR: /tmp/nora-xdg-runtime
          WESTON_SOCKET: nora-ci
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          # Nested compositor on a named socket so the wait below is exact.
          weston --backend=headless --socket="$WESTON_SOCKET" \
            --log=weston.log &
          WESTON_PID=$!
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/$WESTON_SOCKET" ] && break
            sleep 1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WESTON_SOCKET" ]; then
            cat weston.log
            exit 1
          fi
          set +e
          WAYLAND_DISPLAY="$WESTON_SOCKET" ./target/release/nora --smoke
          STATUS=$?
          set -e
          kill "$WESTON_PID" 2>/dev/null || true
          exit "$STATUS"

  e2e-x11:
    name: end-to-end window checks (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xdotool imagemagick xkb-data libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers fonts-noto-core fonts-noto-cjk \
            vim tmux htop zsh ibus
      - name: cargo build --release
        run: cargo build --release --locked
      - name: scripts/e2e-x11.sh
        run: scripts/e2e-x11.sh
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-x11
          path: target/e2e

  cross-platform:
    name: ${{ matrix.os }} (build + headless tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Binary runs
        run: |
          ./target/release/nora --version
          ./target/release/nora --check-config
      - name: Unit tests (library and binaries)
        run: cargo test --locked --lib --bins
      - name: Platform-neutral integration tests
        run: >
          cargo test --locked
          --test config --test engine --test engine_adapter --test engine_snapshots
          --test input_encode --test kitty_keyboard --test layout --test mouse_input
          --test paste_input --test prompt_marker --test render_state --test scrollback
          --test search --test selection --test session_bounded --test session_writer
          --test workspace --test graphics_filter --test graphics_image
          --test graphics_protocol --test ime --test decoration_policy
          --test resource_limits
      - name: PTY integration tests (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          cargo test --locked --no-fail-fast \
            --test pty_session --test pump_session --test keypad_input \
            --test navigation_input --test paste_pump 2>&1 | tee pty.log
          STATUS=${PIPESTATUS[0]}
          set -e
          # Annotations carry one line each: report each panic location
          # together with its message (the line after it).
          grep -E "^test .* FAILED$" pty.log | sort -u | head -20 \
            | sed 's/^/::error::/' || true
          grep -A1 "panicked at" pty.log | grep -v '^--$' | paste -d' ' - - \
            | cut -c1-1500 | head -20 | sed 's/^/::error::/' || true
          exit "$STATUS"
