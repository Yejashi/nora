[package]
name = "nora"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A GPU-accelerated terminal for Linux, written in Rust, with inline command suggestions"
license = "MIT"

# Explicit windowing backend configurations (N30). winit's default
# feature set enables both X11 and Wayland; these features let CI and
# users build each documented backend in isolation:
#   default (both backends):  cargo build
#   X11 only:                 cargo build --no-default-features --features x11
#   Wayland only:             cargo build --no-default-features --features wayland
[features]
default = ["x11", "wayland"]
x11 = ["winit/x11"]
# Mirrors winit's default Wayland stack (client + dlopen backend +
# client-side decorations), plus the native Wayland clipboard (ADR-016).
wayland = [
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita",
    "dep:smithay-clipboard",
]
# Measurement builds only: count heap allocations per thread and report
# them per frame in `NORA_TRACE_FRAMES` output (audit R12).
alloc-count = []

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6"
# Decodes OSC 6973 shell buffer reports (ADR-013); the same version
# alacritty_terminal already pulls in.
base64 = "0.22.1"
# Direct dependency (same pinned version glyphon pulls in): enables
# `Font::unicode_codepoints()` for per-char font fallback (N13a).
cosmic-text = { version = "0.19", features = ["monospace_fallback"] }
# Kitty graphics (ADR-014): zlib-compressed transfers (`o=z`). Already in
# the lock through png.
flate2 = "1.1.10"
glyphon = "0.12.0"
libc = "0.2"
pollster = "0.4"
# Kitty graphics (ADR-014): PNG images (`f=100`). Already in the lock
# through arboard's image.
png = "0.18.1"
# Pinned to the `serde` already in the lock (1.0.229) via `glyphon`/`winit`.
serde = { version = "1", features = ["derive"] }
# Validated TOML configuration (N18a). Resolves against the existing
# `toml_edit`/`serde` family in the lock.
toml = "0.8"
# Display width of IME preedit text (same version alacritty_terminal pins).
unicode-width = "0.2.2"
wgpu = "30.0.1"
winit = "0.30.13"

# Screen readers (N37, ADR-015): the terminal text as an AT-SPI2 tree
# through AccessKit's Unix adapter (D-Bus via zbus). Linux and the BSDs
# only; other platforms have no provider yet.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit = "0.25.1"
accesskit_unix = "0.24.0"
# Native Wayland clipboard (ADR-016): its own wl_data_device on winit's
# wl_display, so a Wayland window never goes through XWayland. 0.7.2 is
# the last release on smithay-client-toolkit 0.19 (winit's); 0.7.3 moved
# to 0.20 and would add a second sctk/calloop stack. Built only with the
# `wayland` feature.
smithay-clipboard = { version = "=0.7.2", optional = true }

[dev-dependencies]
# Tests drive the vendored `EventLoop` with a fake PTY, whose
# `EventedReadWrite` impl names these types; the version alacritty_terminal
# already pulls in.
polling = "3.11.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# N32b: vendor alacritty_terminal to add a byte-level `Filter` hook to the
# PTY reader. Kitty-graphics APCs are dropped by the vte parser on BOTH the
# `Engine::feed` (headless/tests) and `EventLoop::pty_read` (PTY) paths, so
# the filter must run inside the pinned `EventLoop` (N32a already covers the
# `Engine::feed` path). The vendored copy is byte-identical to the pinned
# 0.26.0 except where marked `// nora:`: the `Filter` trait, the
# `EventLoop::filter` field, `EventLoop::with_filter`, the `pty_read` hook
# and `at_marker_position` (markers inside a synchronized update), the
# in-flight input counter, deferring a `pty_read` error until already-read
# bytes are parsed and woken for (no lost final output), `pty_read`
# returning the bytes it parsed and the exit drain repeating it (bounded),
# no redraw while a synchronized update is pending (`with_sync_pending`)
# and ending an update at its own deadline under continuous output,
# the filter's `needs_unlocked`/`run_unlocked` hooks (file media read with
# the lock released), `send` accepting a queued message whatever the waker
# reports, the DA1 reply (`?62;22c`), and `grow_lines` not counting its
# history scroll as a shift. See
# docs/adr/ADR-011-graphics-apc-hook.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
