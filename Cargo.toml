[package]
name = "nora"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A GPU-accelerated terminal for Linux, written in Rust, with inline command suggestions"
license = "MIT"

# Explicit windowing backend configurations (N30). winit's default
# feature set enables both X11 and Wayland; these features let CI and
# users build each documented backend in isolation:
#   default (both backends):  cargo build
#   X11 only:                 cargo build --no-default-features --features x11
#   Wayland only:             cargo build --no-default-features --features wayland
[features]
default = ["x11", "wayland"]
x11 = ["winit/x11"]
# Mirrors winit's default Wayland stack (client + dlopen backend +
# client-side decorations).
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]
# Measurement builds only: count heap allocations per thread and report
# them per frame in `NORA_TRACE_FRAMES` output (audit R12).
alloc-count = []

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6"
# Decodes OSC 6973 shell buffer reports (ADR-013); the same version
# alacritty_terminal already pulls in.
base64 = "0.22.1"
# Direct dependency (same pinned version glyphon pulls in): enables
# `Font::unicode_codepoints()` for per-char font fallback (N13a).
cosmic-text = { version = "0.19", features = ["monospace_fallback"] }
glyphon = "0.12.0"
libc = "0.2"
pollster = "0.4"
# Pinned to the `serde` already in the lock (1.0.229) via `glyphon`/`winit`.
serde = { version = "1", features = ["derive"] }
# Validated TOML configuration (N18a). Resolves against the existing
# `toml_edit`/`serde` family in the lock.
toml = "0.8"
# Display width of IME preedit text (same version alacritty_terminal pins).
unicode-width = "0.2.2"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# N32b: vendor alacritty_terminal to add a byte-level `Filter` hook to the
# PTY reader. Kitty-graphics APCs are dropped by the vte parser on BOTH the
# `Engine::feed` (headless/tests) and `EventLoop::pty_read` (PTY) paths, so
# the filter must run inside the pinned `EventLoop` (N32a already covers the
# `Engine::feed` path). The vendored copy is byte-identical to the pinned
# 0.26.0 except for: the `Filter` trait, the `EventLoop::filter` field,
# `EventLoop::with_filter`, the `pty_read` hook, and deferring a `pty_read`
# error until already-read bytes are parsed (no lost final output). See
# docs/adr/ADR-011-graphics-apc-hook.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
