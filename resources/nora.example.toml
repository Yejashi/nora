# nora configuration example.
#
# Copy to ~/.config/nora/config.toml (or $XDG_CONFIG_HOME/nora/config.toml)
# and edit. Every section and key is optional; anything omitted uses the
# built-in default shown here. Unknown keys are errors, so typos are caught.
#
# The file is watched: saving it applies the change to the running window
# (Ctrl+Shift+F5 reloads by hand). A file that fails to load or validate
# leaves the current settings in place and shows the error on screen.
# Validate without launching:   nora --check-config
#
# What applies when:
#   immediately       colors, cursor, key bindings, scrolling.multiplier,
#                     autocomplete
#   immediately       font (fonts reload and every pane is resized)
#   new panes/tabs    scrolling.history
#   at startup        window

[font]
# A fontconfig family name, e.g. "JetBrains Mono" or "FiraCode Nerd Font
# Mono" (a Nerd Font gives prompt icons). "monospace" uses nora's default
# chain: Noto Sans Mono, DejaVu Sans Mono, fontconfig's monospace. Bold and
# italic faces of the family are used when installed; characters the font
# lacks fall back to any installed font that has them.
family = "monospace"
# Points (4 <= size <= 200). 1 pt = 4/3 px at 96 DPI, scaled by the
# display scale factor. Ctrl+Shift+Plus/Minus/0 zoom from this size.
size = 15.0

[colors]
# #RRGGBB. Unset entries keep nora's xterm-style defaults. Applications can
# still change colors at run time (OSC 4/10/11).
# foreground = "#ffffff"
# background = "#000000"
# cursor = "#ffffff"
# selection_background = "#335577"

[colors.normal]
# black = "#000000"
# red = "#cd0000"
# green = "#00cd00"
# yellow = "#cdcd00"
# blue = "#0000ee"
# magenta = "#cd00cd"
# cyan = "#00cdcd"
# white = "#e5e5e5"

[colors.bright]
# black = "#7f7f7f"
# red = "#ff0000"
# green = "#00ff00"
# yellow = "#ffff00"
# blue = "#5c5cff"
# magenta = "#ff00ff"
# cyan = "#00ffff"
# white = "#ffffff"

[window]
# Initial size in cells (2..=1000).
columns = 80
lines = 24

[cursor]
# "block", "beam" or "underline": the shape until an application sets one.
# An unfocused window shows a hollow block.
style = "block"

[scrolling]
# Scrollback lines per pane (0..=1000000).
history = 10000
# Lines per mouse-wheel step (1..=100).
multiplier = 3

[autocomplete]
# Inline suggestions while you type at a zsh prompt (needs
# shell/nora-zsh.zsh). nora records the commands the shell reports in
# $XDG_STATE_HOME/nora/history (default ~/.local/state/nora/history, mode
# 0600); commands starting with a space are never recorded. false turns
# suggestions off and nora neither reads nor writes the file.
enabled = true

# Key bindings. Each entry binds a chord to an action, or frees a default
# chord with action = "none" so the key reaches the application.
# Modifiers: ctrl, shift, alt, super. Keys: a-z, 0-9, f1-f12, enter, tab,
# space, escape, backspace, delete, insert, home, end, pageup, pagedown,
# left, right, up, down, minus, equal (plus), backslash, slash, comma,
# period, semicolon, bracketleft, bracketright.
# Actions: copy, paste, new_tab, next_tab, previous_tab, close_pane,
# split_right, split_down, focus_left, focus_right, focus_up, focus_down,
# search, zoom_in, zoom_out, zoom_reset, scroll_page_up, scroll_page_down,
# scroll_to_top, scroll_to_bottom, reload_config, previous_prompt,
# select_previous_command, accept_suggestion, accept_suggestion_word, none.
#
# [[keyboard.bindings]]
# keys = "ctrl+shift+d"
# action = "split_right"
#
# [[keyboard.bindings]]
# keys = "ctrl+pageup"
# action = "none"
